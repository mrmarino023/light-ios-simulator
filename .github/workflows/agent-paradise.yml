name: Agent paradise

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  agent-paradise:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-paradise-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --locked -p ligh-cli -p ligh-daemon

      - name: Python unit tests (agent API)
        run: |
          PYTHONPATH=scripts python3 -m unittest test_ligh_audit test_repair_engine test_structural_kb -q
          python3 -m py_compile scripts/ligh_agent_api.py scripts/ligh_mcp.py scripts/ligh_viewer.py

      - name: Shell syntax (paradise scripts)
        run: |
          bash -n scripts/ligh-paradise.sh
          bash -n scripts/ligh-test.sh
          bash -n scripts/ligh-init.sh
          bash -n scripts/print-cursor-mcp.sh

      - name: Scaffold .ligh bundle (offline)
        run: |
          # Prefer xcodeproj — fixtures/**/build/ is gitignored so .app is absent on CI.
          # Missing-.app paths also fall back to sibling .xcodeproj in ligh_project.detect.
          PYTHONPATH=scripts python3 scripts/ligh_project.py fixtures/LighFixture --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('ligh_dir'); assert d.get('kind') in ('xcodeproj','app'); print('grade', d.get('audit',{}).get('readiness_grade'), 'kind', d.get('kind'))"
          PYTHONPATH=scripts python3 scripts/ligh_project.py fixtures/LighFixture/build/LighFixture.app --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('ligh_dir'); assert d.get('kind')=='xcodeproj'; print('missing-app fallback ok', d.get('scheme'))"
